[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-multi-agent-mcp"
version = "0.1.0"
description = "LangGraph multi-agent system with an MCP-backed robotics RAG and OpenSCAD previews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "fastmcp>=2,<4",
    "httpx>=0.27,<1",
    "langchain>=0.3",
    "langchain-google-genai>=2",
    "langchain-groq>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "nemoguardrails>=0.21,<1",
    "pandas>=2,<3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "mcp_server*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
