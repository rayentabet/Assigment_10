[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-multi-agent-mcp"
version = "0.1.0"
description = "LangGraph multi-agent system with an MCP-backed robotics RAG and 3D robot previews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
    "a2a-sdk>=1,<2",
    "build123d>=0.9",
    "faster-whisper>=1.2,<2",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "fastmcp>=2,<4",
    "httpx>=0.27,<1",
    "langchain>=0.3",
    "langchain-google-genai>=2",
    "langchain-groq>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "nemoguardrails>=0.21,<1",
    "pandas>=2,<3",
    "pillow>=10,<14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "qdrant-client",
    "rank-bm25",
    "sentence-transformers",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

# Each service owns its code under services/, but the packages stay importable
# as top-level modules (`from app.graph import ...`) so tests/ and evaluation/
# at the repository root, and the containers themselves, use the same imports.
[tool.setuptools.packages.find]
where = [
    "services/agent-system-a",
    "services/agent-system-b",
    "services/mcp-server",
]
include = ["app*", "agents*", "tools*", "component_manager*", "mcp_server*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [
    ".",
    "services/agent-system-a",
    "services/agent-system-b",
    "services/mcp-server",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Mirrors the packaging roots above so isort still recognises app/, agents/,
# tools/ and component_manager as first-party imports from services/.
src = [
    ".",
    "services/agent-system-a",
    "services/agent-system-b",
    "services/mcp-server",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
