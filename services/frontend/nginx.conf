server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The React app is a single-page application: any path that is not a real
    # file must still return index.html so client-side routing can handle it,
    # instead of nginx answering 404 on a refresh of a nested route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable, so let the browser keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
