# Five services, one command: `docker compose up -d --build`.
#
# Each service builds from its own directory under services/ with its own
# Dockerfile and requirements file, so any one of them can be built and started
# on its own. System A reaches System B and the MCP server over the network by
# service name, never by importing them.

services:
  vector-db:
    image: qdrant/qdrant:latest
    container_name: vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./services/mcp-server/qdrant:/qdrant/snapshots/bootstrap:ro
    restart: unless-stopped

  mcp-server:
    build:
      context: ./services/mcp-server
    image: mcp-server:local
    container_name: mcp-server
    env_file:
      - .env
    environment:
      RAG_PATH: /app/rag
      # Same compose network as vector-db, reached by service name through
      # Compose's built-in DNS - no host.docker.internal hack needed.
      QDRANT_URL: http://vector-db:6333
      QDRANT_SNAPSHOT_LOCATION: file:///qdrant/snapshots/bootstrap/arduino_rag.snapshot
      QDRANT_SNAPSHOT_CHECKSUM: 8939a88afcf5070458060097bbc69710e952af570e319ea7a07cd5b18874ae92
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      HF_HUB_DISABLE_XET: "1"
    depends_on:
      - vector-db
    ports:
      - "8001:8000"
    restart: unless-stopped

  agent-system-b:
    build:
      context: ./services/agent-system-b
    image: agent-system-b:local
    container_name: agent-system-b
    env_file:
      - services/agent-system-b/.env
    environment:
      # Other containers reach it by service name, not 127.0.0.1 (the .env
      # default, which is meant for local non-Docker runs).
      ADVERTISED_HOST: agent-system-b
    ports:
      # 8002 is the A2A endpoint System A calls; 8003 is System B's own
      # REST/SSE API. Both are served from this one container.
      - "8002:8002"
      - "8003:8003"
    volumes:
      - component_manager_data:/app/component_manager/data
    restart: unless-stopped

  agent-system-a:
    build:
      context: ./services/agent-system-a
    image: agent-system-a:local
    container_name: agent-system-a
    env_file:
      - .env
    environment:
      # Service-name DNS instead of the 127.0.0.1 defaults used for running
      # everything locally without Docker.
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      COMPONENT_MANAGER_A2A_URL: http://agent-system-b:8002
      COMPONENT_MANAGER_REST_URL: http://agent-system-b:8003
      QDRANT_URL: http://vector-db:6333
      # Matches the read-only bind mount below.
      RAG_PROJECT_PATH: /app/rag
    # depends_on waits for the container process to start, not for uvicorn
    # inside it to accept connections - a real deployment would add
    # healthchecks and `condition: service_healthy`.
    depends_on:
      - mcp-server
      - agent-system-b
      - vector-db
    ports:
      # Host port 8000 is taken by an unrelated local service on this
      # machine, so the container's own 8000 is published on 8010 instead.
      - "8010:8000"
    volumes:
      - app_chat_data:/app/data
      - app_generated:/app/generated
      # System A only reads images selected by the MCP show_image tool.
      - ./services/mcp-server/rag:/app/rag:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      args:
        # Vite inlines this at build time. It points at the host-published
        # port because the browser runs outside the compose network.
        VITE_API_BASE_URL: http://localhost:8010
    image: frontend:local
    container_name: frontend
    depends_on:
      - agent-system-a
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  qdrant_data:
  component_manager_data:
  app_chat_data:
  app_generated:
