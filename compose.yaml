services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: Assignment_10/Dockerfile
    image: arduino-rag-mcp:local
    container_name: arduino-rag-mcp
    env_file:
      - ../Assignment_8/.env
      - .env
    environment:
      RAG_PATH: /app/assignment_8
      # Same docker network as the qdrant service below, reached by
      # container name via Compose's built-in DNS - no host.docker.internal
      # hack needed now that Qdrant is a service instead of a host process.
      QDRANT_URL: http://qdrant:6333
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      HF_HUB_DISABLE_XET: "1"
    depends_on:
      - qdrant
    ports:
      - "8001:8000"
    restart: unless-stopped

  component-manager:
    build:
      context: .
      dockerfile: component_manager/Dockerfile
    image: component-manager:local
    container_name: component-manager
    env_file:
      - component_manager/.env
    environment:
      # Other containers on this network reach it by service name, not
      # 127.0.0.1 (the .env default meant for local, non-Docker runs).
      ADVERTISED_HOST: component-manager
    ports:
      - "8002:8002"
    volumes:
      - component_manager_data:/app/component_manager/data
    restart: unless-stopped

  component-manager-rest:
    image: component-manager:local
    container_name: component-manager-rest
    command: ["python", "-m", "uvicorn", "component_manager.rest_api:app", "--host", "0.0.0.0", "--port", "8003"]
    env_file:
      - component_manager/.env
    ports:
      - "8003:8003"
    volumes:
      - component_manager_data:/app/component_manager/data
    restart: unless-stopped

  app-api:
    build:
      context: .
      dockerfile: app.Dockerfile
    image: robotics-app-api:local
    container_name: app-api
    env_file:
      - .env
    environment:
      # Container-name DNS instead of the 127.0.0.1 defaults meant for
      # running everything locally, non-Docker.
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      COMPONENT_MANAGER_A2A_URL: http://component-manager:8002
      QDRANT_URL: http://qdrant:6333
      # Matches the read-only bind mount below.
      RAG_PROJECT_PATH: /app/assignment_8
    # depends_on here only waits for the container process to start, not for
    # FastAPI/uvicorn inside it to be ready to accept connections - a real
    # deployment would add healthchecks and `condition: service_healthy`.
    depends_on:
      - mcp-server
      - component-manager
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - app_chat_data:/app/data
      - app_generated:/app/generated
      # System A only reads images the RAG already found (show_image
      # results); it doesn't need the corpus copied into its own image the
      # way mcp-server's build does.
      - ../Assignment_8:/app/assignment_8:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  component_manager_data:
  app_chat_data:
  app_generated:
