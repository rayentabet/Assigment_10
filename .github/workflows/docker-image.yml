name: Build and Push Component Manager

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Component Manager
        uses: docker/build-push-action@v7
        with:
          context: ./services/agent-system-b
          file: services/agent-system-b/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/component-manager:latest
            ${{ vars.DOCKERHUB_USERNAME }}/component-manager:${{ github.sha }}
